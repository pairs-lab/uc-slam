  tumvi:
    description: TUM Visual-Inertial dataset (Schubert et al., IROS 2018), EuRoC/ASL export, 512x512 16-bit
    layout: tumvi_euroc_export
    canonical_host: https://cdn3.vision.in.tum.de/tumvi/exported/euroc/512_16/
    canonical_status: 'reachable 2026-09-19; run-1 curl chain measured 4.5-4.7 MB/s single connection
      (room3-6); fetch_datasets.py measured 9.8-10.6 MB/s per connection with two
      concurrent, 5.5 MB/s each once the extraction jobs competed for disk'
    md5_published: 'yes, one <archive>.md5 per tar on the same host (recorded below as md5_server)'
    tar_layout: 'dataset-<name>_512_16/mav0/{cam0,cam1,imu0,mocap0}/data.csv (images in cam*/data/*.png,
      512x512 16-bit) and dataset-<name>_512_16/dso/{camchain.yaml,imu_config.yaml,imu.txt,gt_imu.csv,
      cam{0,1}/{camera.txt,pcalib.txt,vignette.png,times.txt,images->../../mav0/cam*/data}}'
    calibration_note: 'CORRECTED 2026-09-19 after inspecting the tar: the 512_16 euroc export carries NO
      sensor.yaml files.  Calibration is Kalibr-format dso/camchain.yaml (pinhole + equidistant,
      T_cam_imu per camera, T_cn_cnm1) and dso/imu_config.yaml (200 Hz; inflated noise densities
      a=0.0028 m/s^1.5, a_rw=0.00086, g=0.00016 rad/s^0.5, g_rw=0.000022; Allan values in comments).
      fetch_datasets.py extracts dso/ next to mav0/.  Raw calibration recordings exist at
      .../512_16/dataset-calib-{cam1..8,imu1..4,vignette2,3}_512_16.tar (not downloaded).'
    gt_csv: mav0/mocap0/data.csv
    gt_frame: 'header "#timestamp [ns], p_RS_R_x [m], ..., q_RS_w [], q_RS_x [], q_RS_y [], q_RS_z []" as
      in EuRoC (S = IMU/body frame, R = mocap world; q stored w,x,y,z).  The data rows are identical to
      dso/gt_imu.csv (checked with diff on room1), i.e. the export gives the IMU pose, not the raw
      marker pose.  Mocap rate ~107-119 Hz with dropouts (max gap 0.17-3.15 s on room1-6).'
    holdout: [room5, room6]
