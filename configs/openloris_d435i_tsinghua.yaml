%YAML:1.0
# OpenLORIS-Scene, tsinghua robot (office1-1, office1-2, office1-3, office1-4, office1-5, office1-6, office1-7, corridor1-1, corridor1-2, corridor1-3, corridor1-4, corridor1-5, home1-1, home1-2, home1-3, home1-4, home1-5, cafe1-1, cafe1-2). Written by scripts/make_openloris_settings.py
# from the stock third_party/ORB_SLAM3/Examples/Monocular-Inertial/RealSense_D435i.yaml (protocol A14).
# Replaced: Camera1.fx/fy/cx/cy, Camera.width/height, IMU.T_b_c1 (release calibration) and
# IMU.Frequency (400 Hz, the converted IMU stream). Every other line is the stock text.

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Right Camera calibration and distortion parameters (OpenCV)
Camera1.fx: 611.450989
Camera1.fy: 611.485718
Camera1.cx: 433.203979
Camera1.cy: 249.473022

# distortion parameters
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Camera resolution
Camera.width: 848
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Transformation from body-frame (imu) to left camera
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999975453, -0.003828680, -0.005868115, -0.020397565,
         0.003849141, 0.999986539, 0.003479442, 0.005063971,
         0.005854715, -0.003501944, 0.999976729, 0.011064331,
         0.000000000, 0.000000000, 0.000000000, 1.000000000]

# Do not insert KFs when recently lost
IMU.InsertKFsWhenLost: 0

# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 1e-3 # 2.44e-4 #1e-3 # rad/s^0.5
IMU.NoiseAcc: 1e-2 # 1.47e-3 #1e-2 # m/s^1.5
IMU.GyroWalk: 1e-6 # rad/s^1.5
IMU.AccWalk: 1e-4 # m/s^2.5
IMU.Frequency: 400.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1250

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

#--------------------------------------------------------------------------------------------
# UC-SLAM parameters
#--------------------------------------------------------------------------------------------
# Generated by scripts/gen_ucslam_yaml.py from the ucslam block of configs/default.yaml
# for domain openloris. Do not edit by hand. Regenerate instead. Every key above this
# block is the repository file configs/orbslam3/openloris_mono_inertial_stock_tsinghua.yaml (scripts/make_openloris_settings.py), copied verbatim.
# A float carries a decimal point because Settings::readParameter<float> is typed.
# Variant a11r_capgatex of ucslam.variants in configs/default.yaml overrides: DepthEdgeGateAtAdd=1, DepthEdgeSubsampleEps=0.0, DepthEdgesStereoObs=0, DepthGateMode=1, DiagMargCheck=0, DiagSubsampleCheck=0, ImuInitHandoff=1, LbaMargDiagOnly=1, LogInitState=1, ScaleRefineMaxLog=0.01, UseDepthFactor=1, YoungMapBiasGate=0.0905, YoungMapGateShadow=0, YoungMapScaleGate=1.0
UCSLAM.Dataset: "openloris"
UCSLAM.PriorNet: 1
UCSLAM.DepthDir: "data/depth"
UCSLAM.DepthModel: "da2-metric-indoor-base"
UCSLAM.DepthMatchTolMs: 1.0
UCSLAM.UseDepthFactor: 1
UCSLAM.SigmaNetC0: 0.1256
UCSLAM.SigmaNetC1: -0.03228
UCSLAM.LogBias: 0.1532
UCSLAM.NeffOverN: 0.0039
UCSLAM.ZRef: 1.0
UCSLAM.Sigma0: 0.1
UCSLAM.SigmaRW: 0.02
UCSLAM.ESSDeflation: 1
UCSLAM.MaxDepthPriorPoints: 100
UCSLAM.InitPolicy: "timer"
UCSLAM.InitMinWindow: 2.0
UCSLAM.InitMaxWindow: 15.0
UCSLAM.TauS: 0.15
UCSLAM.TauG: 1.0
UCSLAM.TauBa: 0.05
UCSLAM.DumpMarginals: 0
UCSLAM.CovSource: "pyramid"
UCSLAM.SigmaMerge: 0.1
UCSLAM.Diag: 0
UCSLAM.DepthEdgeMinObs: 1
UCSLAM.DepthEdgesFixedKFs: 1
UCSLAM.ChainFixedBoundary: 1
UCSLAM.ImuInitHandoff: 1
UCSLAM.LogScaleFixed: 0
UCSLAM.DepthGateMode: 1
UCSLAM.DepthEdgesStereoPoints: 1
UCSLAM.LogScaleSeed: 0
UCSLAM.DepthEdgesStereoObs: 0
UCSLAM.DiagLbaDelayMs: 0
UCSLAM.ScaleRefineMaxLog: 0.01
UCSLAM.LogInitState: 1
UCSLAM.YoungMapScaleGate: 1.0
UCSLAM.YoungMapBiasGate: 0.0905
UCSLAM.DepthEdgeGateAtAdd: 1
UCSLAM.LbaMargDiagOnly: 1
UCSLAM.DepthEdgeSubsampleEps: 0.0
UCSLAM.DiagMargCheck: 0
UCSLAM.DiagSubsampleCheck: 0
UCSLAM.YoungMapGateShadow: 0
